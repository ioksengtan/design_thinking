name: 部署到 GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v7

      - name: 準備網站檔案
        run: |
          mkdir -p _site
          cp index.html styles.css app.js _site/
          mkdir -p _site/data
          cp data/cards.json _site/data/cards.json

      - name: 設定 GitHub Pages
        uses: actions/configure-pages@v6

      - name: 上傳網站檔案
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v5
